[bar.default]
background_opacity = 0.80
capsule_group = []
concave_edge_corners = false
end = [
    "media",
    "audio_visualizer",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = 0
position = "bottom"
radius = 30
start = [ "launcher", "wallpaper", "workspaces", "cpu", "ram" ]
widget_spacing = 10

[battery]
warning_threshold = 20

[bluetooth]
connect_when_enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
wallpaper = "/home/emil/nixos-dotfiles/walls/among-us.jpg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
show_close_buttons = false

    [shell.screen_corners]
    size = 15

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "wezterm" ]

[wallpaper]
directory = "/home/emil/nixos-dotfiles/walls"

    [wallpaper.default]
    path = "/home/emil/nixos-dotfiles/walls/among-us.jpg"

    [wallpaper.last]
    path = "/home/emil/nixos-dotfiles/walls/among-us.jpg"

[weather]
refresh_minutes = 15

[widget.cpu]
visualization = "graph"

[widget.ram]
visualization = "graph"
